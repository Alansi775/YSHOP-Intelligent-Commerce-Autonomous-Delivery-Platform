<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/image_picker_for_web@2.1.10/image_picker_for_web.js"></script>

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- viewport-fit=cover lets the page extend under the iPhone notch/
       Dynamic Island and home indicator instead of Safari leaving a plain
       white strip there — Flutter's own SafeArea widgets then handle the
       actual inset padding, same as the native app does. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="yshop">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Matches Android Chrome's own status-bar/toolbar tint to the app so
       there's no visible seam between browser chrome and app content. -->
  <meta name="theme-color" content="#0A0A0A">

  <!-- The gap reported at the top (behind the status bar) and bottom
       (above the address bar) on mobile Safari/Chrome isn't a load-time
       flash — it's the page's own rubber-band/bounce overscroll revealing
       the raw white <body> background beyond the app's edges.
       overscroll-behavior:none (the modern fix, no position:fixed needed)
       stops that bounce; the background-color is the fallback shown in
       that same sliver before Flutter paints over it, matched to the
       app's actual light/dark theme instead of default browser white.
       NOTE: body was previously `position: fixed` here as a belt-and-
       braces version of this fix — that broke Google Sign-In's real
       button (a platform view Flutter overlays as a genuine DOM node,
       not something Flutter itself lays out), which got stuck showing
       "Getting ready" forever because a fixed-position ancestor changes
       how the browser resolves its containing block/measurements. Don't
       reintroduce position: fixed on body without checking that button
       still renders. -->
  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #0A0A0A;
    }
    @media (prefers-color-scheme: light) {
      html, body { background-color: #FAFAFA; }
    }
  </style>

  <title>yshop</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
